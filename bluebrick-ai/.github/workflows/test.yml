name: Test

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
        working-directory: bluebrick-ai
      - name: Run tests
        run: pytest
        working-directory: bluebrick-ai
