name: TEMP Wave B1 PDF.js Public Transport

on:
  push:
    branches:
      - temp/wave-b1-pdfjs-transport

permissions:
  contents: write

jobs:
  transport:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public package and verify canonical VIRA hashes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pdfjs-pkg tmp/wave-b1-pdfjs-transport
          mkdir -p /tmp/pdfjs-pkg tmp/wave-b1-pdfjs-transport
          cd /tmp/pdfjs-pkg
          npm pack pdfjs-dist@3.11.174 --silent >/tmp/pdfjs-pack-name.txt
          tar -xzf "$(cat /tmp/pdfjs-pack-name.txt)"
          test "$(node -p "require('/tmp/pdfjs-pkg/package/package.json').version")" = '3.11.174'
          cp package/build/pdf.min.js "$GITHUB_WORKSPACE/tmp/wave-b1-pdfjs-transport/pdf.min.js"
          cp package/build/pdf.worker.min.js "$GITHUB_WORKSPACE/tmp/wave-b1-pdfjs-transport/pdf.worker.min.js"
          test "$(sha256sum "$GITHUB_WORKSPACE/tmp/wave-b1-pdfjs-transport/pdf.min.js" | awk '{print $1}')" = '5b5799e6f8c680663207ac5b42ee14eed2a406fa7af48f50c154f0c0b1566946'
          test "$(sha256sum "$GITHUB_WORKSPACE/tmp/wave-b1-pdfjs-transport/pdf.worker.min.js" | awk '{print $1}')" = 'feabdf309770ed24bba31a5467836cdc8cf639c705af27d52b585b041bb8527b'
          cat > "$GITHUB_WORKSPACE/tmp/wave-b1-pdfjs-transport/manifest.txt" <<'EOF'
          PDFJS_VERSION=3.11.174
          PDF_MIN_SHA256=5b5799e6f8c680663207ac5b42ee14eed2a406fa7af48f50c154f0c0b1566946
          PDF_WORKER_SHA256=feabdf309770ed24bba31a5467836cdc8cf639c705af27d52b585b041bb8527b
          EOF
      - name: Upload temporary verified asset bundle
        uses: actions/upload-artifact@v4
        with:
          name: wave-b1-pdfjs-3.11.174-exact
          path: tmp/wave-b1-pdfjs-transport/
          if-no-files-found: error
          retention-days: 1
      - name: Commit temporary verified open-source assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/wave-b1-pdfjs-transport
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: stage verified PDF.js 3.11.174 transport'
          git push origin HEAD:temp/wave-b1-pdfjs-transport
